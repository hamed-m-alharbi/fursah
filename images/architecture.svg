e="14" font-weight="700" fill="#F1E6D0">Evidence gate</text><text x="480.0" y="204" text-anchor="middle" font-size="12" fill="#9FB0C6">exact quote per fact</text><line x1="377" y1="186.0" x2="400" y2="186.0" stroke="#E8C77A" stroke-width="2" marker-end="url(#ar)"/><rect x="586" y="150" width="152" height="72" rx="10" fill="#172A42" stroke="#2E4A6B" stroke-width="1.2"/><text x="662.0" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#F1E6D0">Review + approval</text><text x="662.0" y="204" text-anchor="middle" font-size="12" fill="#9FB0C6">groups, corrections</text><line x1="559" y1="186.0" x2="582" y2="186.0" stroke="#E8C77A" stroke-width="2" marker-end="url(#ar)"/><rect x="768" y="150" width="152" height="72" rx="10" fill="#F2B544" stroke="none" stroke-width="1.2"/><text x="844.0" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#0F1B2D">SQLite store</text><text x="844.0" y="204" text-anchor="middle" font-size="12" fill="#0F1B2D" opacity="0.85">318 opportunities</text><line x1="741" y1="186.0" x2="764" y2="186.0" stroke="#E8C77A" stroke-width="2" marker-end="url(#ar)"/><text x="40" y="316" font-size="11" font-weight="700" letter-spacing="2" fill="#9FB0C6">ONLINE · EACH SEARCH</text><rect x="40" y="330" width="152" height="72" rx="10" fill="#172A42" stroke="#2E4A6B" stroke-width="1.2"/><text x="116.0" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#F1E6D0">React UI</text><text x="116.0" y="384" text-anchor="middle" font-size="12" fill="#9FB0C6">profile + free text</text><rect x="222" y="330" width="152" height="72" rx="10" fill="#172A42" stroke="#2E4A6B" stroke-width="1.2"/><text x="298.0" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#F1E6D0">Input parsing</text><text x="298.0" y="384" text-anchor="middle" font-size="12" fill="#9FB0C6">city, type, dates</text><line x1="195" y1="366.0" x2="218" y2="366.0" stroke="#E8C77A" stroke-width="2" marker-end="url(#ar)"/><rect x="404" y="330" width="152" height="72" rx="10" fill="#172A42" stroke="#2E4A6B" stroke-width="2.2"/><text x="480.0" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#F1E6D0">Search + rules</text><text x="480.0" y="384" text-anchor="middle" font-size="12" fill="#9FB0C6">deadline, city, status</text><line x1="377" y1="366.0" x2="400" y2="366.0" stroke="#E8C77A" stroke-width="2" marker-end="url(#ar)"/><rect x="586" y="330" width="152" height="72" rx="10" fill="#172A42" stroke="#2E4A6B" stroke-width="1.2"/><text x="662.0" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#F1E6D0">Agent shortlist</text><text x="662.0" y="384" text-anchor="middle" font-size="12" fill="#9FB0C6">up to 10, grounded</text><line x1="559" y1="366.0" x2="582" y2="366.0" stroke="#E8C77A" stroke-width="2" marker-end="url(#ar)"/><rect x="768" y="330" width="152" height="72" rx="10" fill="#172A42" stroke="#2E4A6B" stroke-width="1.2"/><text x="844.0" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#F1E6D0">Rerank + explain</text><text x="844.0" y="384" text-anchor="middle" font-size="12" fill="#9FB0C6">reasons from the record</text><line x1="741" y1="366.0" x2="764" y2="366.0" stroke="#E8C77A" stroke-width="2" marker-end="url(#ar)"/><path d="M844.0 222 V 326" stroke="#E8C77A" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#ar)"/><text x="854.0" y="262" font-size="12" fill="#9FB0C6">read only</text><text x="480.0" y="246" text-anchor="middle" font-size="12" fill="#9FB0C6">no quote → stays unknown</text><path d="M844.0 402 V 444 H 116.0 V 406" stroke="#E8C77A" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="480.0" y="436" text-anchor="middle" font-size="12" fill="#9FB0C6">results · needs more info · no match</text><text x="40" y="500" font-size="12" fill="#9FB0C6">FastAPI · Pydantic · SQLite · OpenRouter · Phoenix tracing · React · Docker</text></svg>
